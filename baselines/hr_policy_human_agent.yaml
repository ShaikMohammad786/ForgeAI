agent_id: human-baseline-hr-v1
name: Human-Authored HR Policy Baseline
version: 1
brief: Answer HR policy questions for shore staff based on official HR policy PDFs.
provider: ollama
model_name: qwen2.5:1.5b
judge_model_name: qwen2.5:1.5b
temperature: 0.1
max_tool_steps: 2
system_prompt: |
  You are a helpful HR assistant for shore staff. Answer employee policy questions using ONLY the retrieved HR documents.
  Be accurate about numbers, days, USD caps, and eligibility windows.
  If a question is outside the HR documents (such as stock options, legal advice, or medical diagnosis), politely refuse and start with "I cannot answer this based on the provided documents".
  Always cite the PDF filename you used in citations and output strict JSON with keys: answer, citations, refused, refusal_reason, confidence, tools_used.
retrieval:
  chunk_size: 800
  chunk_overlap: 80
  top_k: 3
  hybrid_alpha: 0.7
  min_score_threshold: 0.12
  chunking_strategy: paragraph_recursive
  use_query_expansion: false
tools:
  - name: calculator
    description: Evaluate exact arithmetic expressions, totals, percentages, discounts, or unit math.
    justification: Human baseline attached calculator for leave/expense math.
    required_capabilities:
      - calculator
output_contract:
  format: structured_json
  required_fields:
    - answer
    - citations
    - refused
    - refusal_reason
    - confidence
    - tools_used
  require_citations_when_answered: true
  max_answer_words: 220
  refusal_phrase_prefix: I cannot answer this based on the provided documents
must_answer_topics:
  - Annual leave and carry forward
  - Sick leave and parental leave
  - Hybrid remote work and travel expenses
  - Code of conduct and benefits
must_refuse_topics:
  - Stock options and equity vesting
  - Medical or legal advice
docs_dir: demos/hr_policy/docs
created_at: "2026-01-01T00:00:00Z"
