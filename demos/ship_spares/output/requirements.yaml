- question: What is the expected behavior for port freight lead times if they fall
    outside the documented schedule in Port_Freight_and_Customs_Schedule.pdf? Should
    we assume a default value or refuse such orders?
  answer: The system should refuse any port freight lead times that are outside of
    the documented schedule.
  answered_by: auto_inferred
  rationale: Establish clear guidelines for handling unexpected or out-of-scope port
    freight lead times.
- question: Should the system calculate total order landed costs based on unit prices
    and quantities from spares_catalogue.csv, or should we also consider any additional
    fees or taxes that might apply?
  answer: The system should calculate total order landed costs based solely on unit
    prices and quantities from spares_catalogue.csv.
  answered_by: auto_inferred
  rationale: Clarify the scope of cost calculations to ensure accuracy and alignment
    with business practices.
