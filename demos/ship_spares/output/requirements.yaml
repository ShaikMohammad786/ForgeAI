- question: What specific emergency credit overrides should the system refuse? Are
    there certain types of emergencies or situations where we can allow exceptions?
  answer: The system should refuse all unapproved emergency credit overrides.
  answered_by: auto_inferred
  rationale: Determine the boundaries for emergency credit overrides to ensure compliance
    and consistency.
- question: Should the system strictly refuse any legal or weather forecasts that
    are outside of the provided documents? Or is there a need to consider external
    sources as well?
  answer: The system should strictly refuse any legal or weather forecasts that are
    outside of the provided documents.
  answered_by: auto_inferred
  rationale: Ensure all inputs and calculations are based on the available data and
