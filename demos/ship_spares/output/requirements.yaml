brief: Build a ship-spares procurement assistant for marine fleet superintendents
  that looks up spare parts from our catalogue CSV, checks supplier discount tiers,
  compliance certificates, and port freight lead times, and calculates total order
  landed costs and estimated arrival dates, while refusing unapproved emergency credit
  overrides or legal/weather forecasts outside the docs.
domain_name: Ship-Spares Procurement Assistant
scope: Build a ship-spares procurement assistant for marine fleet superintendents
  that looks up spare parts from our catalogue CSV, checks supplier discount tiers
  and compliance certificates, calculates total order landed costs, estimated arrival
  dates, refuses unapproved emergency credit overrides or legal/weather forecasts
  outside the provided documents.
audience: marine fleet superintendents
tone: formal
must_answer_topics:
- supplier_discount_tiers
- compliance_certificates
- total_order_landed_costs
- estimated_arrival_dates
must_refuse_topics:
- emergency_credit_overrides
- legal_weather_forecasts_outside_docs
- Questions outside the provided document corpus
recommended_tools:
- csv_lookup
- calculator
rejected_tools:
  open_meteo_weather: Excluded by requirements architect as unnecessary for the brief.
  current_date: Excluded by requirements architect as unnecessary for the brief.
clarifying_qa:
- question: What is the scope of the audience for this ship-spares procurement assistant?
    Are we targeting only marine fleet superintendents or also other stakeholders
    like engineers, maintenance teams, etc.?
  answer: The audience for this ship-spares procurement assistant is primarily marine
    fleet superintendents.
  answered_by: auto_inferred
  rationale: Determining the scope of the audience will help in tailoring the tool's
    features and user interface appropriately.
- question: What are the refusal boundaries for emergency credit overrides? Are there
    specific conditions or criteria under which these overrides should be refused?
  answer: Emergency credit overrides should not be accepted if they do not comply
    with the legal, financial, or operational policies of the organization.
  answered_by: auto_inferred
  rationale: Understanding the refusal boundaries will ensure that the tool adheres
    to organizational policies and regulations.
- question: What are the specific conditions under which compliance certificates should
    be refused? Are there any exceptions for emergency situations?
  answer: Compliance certificates should not be accepted if they do not meet the required
    standards or specifications as outlined in Marine Technical Compliance & Specs
    (PROC-DOC-02). Exceptions may apply for urgent, unforeseen circumstances.
  answered_by: auto_inferred
  rationale: Clarifying refusal boundaries for compliance certificates will ensure
    that only valid and compliant documents are processed.
- question: What is the expected behavior of the tool when a legal or weather forecast
    outside the provided documents is encountered? Should these be strictly refused
    or handled differently?
  answer: The tool should refuse any emergency credit overrides, compliance certificates,
    or port freight lead times that are not within the scope of the provided documents
    and do not comply with organizational policies.
  answered_by: auto_inferred
  rationale: This question ensures that the tool handles unexpected inputs appropriately
    while adhering to organizational standards.
- question: What is the expected behavior when a supplier's discount tier exceeds
    the legal or financial limits set in Supplier SLA & Pricing Terms (PROC-DOC-01)?
    Should these discounts be refused, and if so, what should happen?
  answer: Supplier discounts exceeding the legal or financial limits set in Supplier
    SLA & Pricing Terms (PROC-DOC-01) should be refused. The tool should notify the
    user of the violation and suggest alternative suppliers.
  answered_by: auto_inferred
  rationale: This question ensures that the tool handles supplier discount tiers appropriately,
    adhering to organizational policies.
