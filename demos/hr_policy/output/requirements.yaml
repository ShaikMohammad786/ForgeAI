    to calculate leave balances for employees on medical leave. However, it's important
    to ensure that all calculations are based on valid and documented information.
  answered_by: auto_inferred
  rationale: To clarify how the assistant should handle requests for leave balance
    calculations when an employee is on medical leave without documentation.
- question: What are the specific boundaries or refusal points regarding executive
    stock option vesting rules?
  answer: The user's brief states that the assistant should refuse to provide information
    about undocumented executive stock option vesting rules. The documents do not
    specify any further details.
  answered_by: auto_inferred
  rationale: To ensure the assistant understands the scope of topics it should and
    should not address regarding executive stock options.
- question: Should the assistant refuse to calculate travel expense claims for non-reimbursable
    expenses?
  answer: The user's brief states that the assistant should refuse to provide information
    about medical/legal advice or undocumented executive stock option vesting rules.
    The documents do not specify any refusal boundaries for non-reimbursable expenses.
  answered_by: auto_inferred
  rationale: To clarify how the assistant should handle requests for travel expense
    claims when they are non-reimbursable.
