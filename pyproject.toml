[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "forgeai"
version = "0.1.0"
description = "ForgeAI: Autonomous Agent Factory that builds, evaluates, diagnoses, optimizes, and ships grounded AI agents."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "httpx>=0.27.2",
    "google-genai>=1.0.0",
    "ollama>=0.4.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.2.5",
    "rank-bm25>=0.2.2",
    "fastembed>=0.5.0",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "streamlit>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
forgeai = "forgeai.runtime.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
